<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale Banking Corporate Insight Report</title>
<style>
  /* === Reset & Base === */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    font-size: 11pt;
    line-height: 1.7;
    color: #1a1a1a;
    max-width: 210mm; /* A4 width */
    margin: 0 auto;
    padding: 20mm 15mm 25mm 15mm;
    background: #fff;
  }

  /* === Headings === */
  h1 {
    font-size: 16pt;
    font-weight: 700;
    color: #1F4E79;
    border-bottom: 2px solid #1F4E79;
    padding-bottom: 6px;
    margin: 28px 0 14px 0;
    page-break-after: avoid;
  }

  h2 {
    font-size: 13pt;
    font-weight: 700;
    color: #1F4E79;
    margin: 22px 0 10px 0;
    page-break-after: avoid;
  }

  h3 {
    font-size: 11.5pt;
    font-weight: 600;
    color: #1a1a1a;
    margin: 16px 0 8px 0;
    page-break-after: avoid;
  }

  h4 {
    font-size: 11pt;
    font-weight: 600;
    color: #444;
    margin: 12px 0 6px 0;
  }

  /* === Paragraphs === */
  p {
    margin: 8px 0;
    text-align: justify;
  }

  /* === Bold / Highlights (key numbers in the bank blue) === */
  strong {
    color: #1F4E79;
    font-weight: 600;
  }

  /* === Horizontal Rules === */
  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 24px 0;
  }

  /* === Tables === */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 10pt;
    page-break-inside: avoid;
  }

  thead th {
    background: #1F4E79;
    color: #fff;
    font-weight: 600;
    text-align: left;
    padding: 8px 10px;
    font-size: 9.5pt;
    letter-spacing: 0.3px;
  }

  tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid #e0e0e0;
    vertical-align: top;
  }

  tbody tr:nth-child(even) td {
    background: #f7f9fb;
  }

  tbody tr:hover td {
    background: #e8f0f8;
  }

  /* === Lists === */
  ul, ol {
    margin: 8px 0 8px 20px;
  }

  li {
    margin: 3px 0;
  }

  /* === Print === */
  @media print {
    body {
      padding: 12mm 10mm 15mm 10mm;
      font-size: 10pt;
      color: #000;
    }

    h1 { font-size: 14pt; page-break-before: avoid; }
    h2 { font-size: 12pt; }
    h3 { font-size: 10.5pt; }
    thead th { background: #1F4E79 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tbody tr:nth-child(even) td { background: #f7f7f7 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    @page {
      size: A4;
      margin: 15mm;
    }
  }
</style>
</head>
<body>

{{CONTENT}}

</body>
</html>
